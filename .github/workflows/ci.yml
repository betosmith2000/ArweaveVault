name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:ci

      - name: Test (legacy, non-blocking)
        run: npm run test:ci
        continue-on-error: true

      - name: Lint (legacy, non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
